---
layout: main
---

<nav class="page-nav">
  {% assign current_url = page.url %}
  <a href="{{ site.url }}"{% if current_url == "/" %} class="active"{% endif %}>Home</a>
  {% for p in site.pages %}{% if p.linktoheader == true %}<a href="{{ p.url }}"{% if p.url == current_url %} class="active"{% endif %}>{{ p.title }}</a>{% endif %}{% endfor %}
</nav>
<h1>{{ page.h1_title | default: page.title }}</h1>

{{ content }}
