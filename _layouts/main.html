<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{site.title}}</title>
        <link
            rel="stylesheet"
            href="{{ '/assets/css/custom.css' | relative_url }}"
        />
        <link 
            rel="stylesheet"
            href="{{ '/assets/css/publications.css' | relative_url }}"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="page-{{ page.title | downcase | replace: ' ', '-' }}">

        <div class="container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <img
                    src="{{site.url}}/images/profile.jpeg"
                    alt="Your Name"
                    class="sidebar-image"
                />
                <p class="name">{{site.title}}</p>
                <p class="sml-text-col">{{site.description}}</p>
                <span>
                    <a href="mailto:{{site.email}}" class="email-link" title="Mail">
                        <i class="fas fa-envelope"></i>
                        <!-- Font Awesome Mail Icon -->
                    </a>
                </span>
                <span>
                    <a
                        href="https://github.com/{{site.github_username}}"
                        class="email-link"
                        title="Github"
                    >
                        <i class="fab fa-github"></i>
                        <!-- Font Awesome Mail Icon -->
                    </a>
                </span>
                <span>
                    <a
                        href="https://scholar.google.com/citations?user={{site.google_scholar}}"
                        class="email-link"
                        title="Google Scholar"
                    >
                        <i class="fas fa-graduation-cap"></i>
                        <!-- Font Awesome Mail Icon -->
                    </a>
                </span>
                <span>
                    <a
                        href="https://linkedin.com/in/{{site.linkedin}}"
                        class="email-link"
                        title="Linkedin"
                    >
                        <i class="fab fa-linkedin"></i>
                        <!-- Font Awesome Mail Icon -->
                    </a>
                </span>
                <span>
                    <a
                        href="{{ '/assets/pdf/resume/resume_murali_g_sethuraman.pdf' | relative_url }}"
                        class="email-link"
                        target="_blank"
                        rel="noopener noreferrer"
                        title="Resume (PDF)"
                    >
                        <i class="fa-solid fa-briefcase"></i>
                    </a>
                </span>
                <nav class="sidebar-nav">
                    <a href="{{site.url}}">Home</a>
                    {% for page in site.pages %}{% if page.linktoheader == true %}
                    <a href="{{page.url}}">{{page.title}}</a>
                    {% endif %}{% endfor %}
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="content">{{ content }}</main>
        </div>
    </body>
</html>
